# docker-compose.dev.yml
# Development environment for RAG-AI system
version: '3.8'

services:
  # Vector Database - Qdrant
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: rag-ai-qdrant-dev
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage_dev:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=DEBUG
    networks:
      - rag-ai-dev-network

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: rag-ai-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - rag-ai-dev-network

  # FastAPI Backend (Development)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: development
    container_name: rag-ai-api-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - model_cache_dev:/app/models
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORAGE_ROOT=/app/data
      - HF_HOME=/app/models
      - PYTHONPATH=/app
      - FASTAPI_ENV=development
      - RELOAD=true
    depends_on:
      - qdrant
      - redis
    networks:
      - rag-ai-dev-network

  # Next.js Frontend (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: rag-ai-frontend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    depends_on:
      - api
    networks:
      - rag-ai-dev-network

volumes:
  qdrant_storage_dev:
    driver: local
  redis_data_dev:
    driver: local
  model_cache_dev:
    driver: local

networks:
  rag-ai-dev-network:
    driver: bridge